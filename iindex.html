<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOMADE:TP | Official</title>
    <style>
        :root { 
            --zipper-metal: #8a8a8a; 
            --gold-accent: #d4af37;
        }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050505; font-family: 'Arial', sans-serif; }

        /* 1. 배경 메뉴 레이어 */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1; text-align: center;
        }
        .brand-logo { 
            font-size: clamp(2rem, 8vw, 4rem); color: white; letter-spacing: 12px; 
            opacity: 0; transform: translateY(-20px); transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 200; margin-bottom: 40px;
        }
        .menu-list { list-style: none; padding: 0; }
        .menu-list li { 
            font-size: 1.1rem; margin: 20px 0; color: #666; cursor: pointer;
            opacity: 0; transform: translateY(10px); transition: 0.8s;
            letter-spacing: 4px; text-transform: uppercase;
        }
        .menu-list li.visible { opacity: 1; transform: translateY(0); }
        .menu-list li:hover { color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.4); }

        /* 2. 지퍼 및 데님 레이어 */
        .zipper-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; }
        
        .denim-side { 
            width: 50%; height: 100%; 
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=2000');
            background-size: cover; background-position: center;
            position: relative; transition: transform 0.1s ease-out;
        }

        /* 금속 지퍼 이빨 디테일 */
        .left-denim { border-right: 1px solid #111; }
        .right-denim { border-left: 1px solid #111; }

        .left-denim::after, .right-denim::after {
            content: ''; position: absolute; top: 0; width: 14px; height: 100%;
            background-image: linear-gradient(to bottom, 
                #555 0%, #999 25%, #444 50%, #888 75%, #333 100%);
            background-size: 100% 12px; /* 이빨 크기 */
        }
        .left-denim::after { right: 0; border-radius: 0 2px 2px 0; }
        .right-denim::after { left: 0; border-radius: 2px 0 0 2px; }

        /* 3. 실제 지퍼 손잡이(Puller) */
        #puller {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, 0);
            width: 54px; height: 85px; z-index: 20; cursor: grab;
        }
        /* 지퍼 몸체 */
        .puller-body {
            width: 100%; height: 40px; background: linear-gradient(145deg, #777, #333);
            border-radius: 4px; position: relative; border: 1px solid #222;
        }
        /* 아래로 달린 손잡이 탭 */
        .puller-tab {
            width: 34px; height: 55px; background: linear-gradient(145deg, #888, #444);
            margin: -5px auto 0; border-radius: 4px; border: 1px solid #222;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        .puller-tab::before {
            content: 'TP'; color: #111; font-weight: bold; font-size: 14px; opacity: 0.7;
        }

        .guide-arrow {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            color: #fff; z-index: 25; font-size: 11px; letter-spacing: 5px;
            animation: bounce 2s infinite; opacity: 0.5;
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translate(-50%, 0);} 40% {transform: translate(-50%, -10px);} 60% {transform: translate(-50%, -5px);} }
    </style>
</head>
<body>

    <div class="content-layer">
        <div class="brand-logo" id="logo">NOMADE:TP</div>
        <ul class="menu-list">
            <li class="m-item">New Expedition</li>
            <li class="m-item">Lookbook '26</li>
            <li class="m-item">Store</li>
            <li class="m-item">Contact</li>
        </ul>
    </div>

    <div class="zipper-wrapper">
        <div class="denim-side left-denim" id="left"></div>
        <div class="denim-side right-denim" id="right"></div>
        <div id="puller">
            <div class="puller-body"></div>
            <div class="puller-tab"></div>
        </div>
    </div>

    <div class="guide-arrow">PULL DOWN</div>

    <audio id="zip-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script>
        const puller = document.getElementById('puller');
        const left = document.getElementById('left');
        const right = document.getElementById('right');
        const logo = document.getElementById('logo');
        const items = document.querySelectorAll('.m-item');
        const sound = document.getElementById('zip-sound');

        let isDragging = false;
        let lastPos = 0;

        const handleMove = (clientY) => {
            const h = window.innerHeight;
            let percent = (clientY / h) * 100;
            if (percent < 0) percent = 0;
            if (percent > 85) percent = 85;

            puller.style.top = percent + '%';
            
            // 지퍼가 벌어지는 현실적인 각도 (위는 고정, 아래만 벌어짐)
            left.style.transformOrigin = "top right";
            right.style.transformOrigin = "top left";
            left.style.transform = `translateX(-${percent}%) rotate(-${percent/12}deg)`;
            right.style.transform = `translateX(${percent}%) rotate(${percent/12}deg)`;

            // 사운드 및 로고 투명도
            if (Math.abs(clientY - lastPos) > 8) {
                sound.currentTime = 0;
                sound.volume = 0.15;
                sound.play().catch(() => {});
                lastPos = clientY;
            }

            if (percent > 10) {
                logo.style.opacity = percent / 80;
                logo.style.transform = `translateY(0) scale(${0.95 + (percent/1000)})`;
                items.forEach((item, i) => {
                    setTimeout(() => item.classList.add('visible'), i * 120);
                });
            }
        };

        puller.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => isDragging && handleMove(e.clientY));

        puller.addEventListener('touchstart', (e) => { isDragging = true; e.preventDefault(); });
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', (e) => isDragging && handleMove(e.touches[0].clientY), {passive: false});
    </script>
</body>
</html>
