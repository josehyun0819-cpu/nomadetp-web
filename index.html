<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NOMADETP</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  overflow:hidden;
  font-family:"Cormorant Garamond",serif;
  background:#0f1722;
  color:white;
}

/* ===== 데님 ===== */
.denim{
  position:fixed;
  inset:0;
  background:
    repeating-linear-gradient(
      90deg,
      #1c2d44 0px,
      #1c2d44 2px,
      #1a2a3f 2px,
      #1a2a3f 4px
    ),
    linear-gradient(145deg,#243a56,#16283c);
}

/* ===== 안쪽 공간 ===== */
.inside{
  position:absolute;
  inset:0;
  background:#0b0b0b;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  clip-path:polygon(50% 0%,50% 0%,50% 100%,50% 100%);
  transition:clip-path 1.2s cubic-bezier(.77,0,.18,1);
}

.inside.open{
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
}

/* ===== 지퍼 SVG ===== */
.zipper{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:100%;
  z-index:10;
  pointer-events:none;
}

.zipper svg{
  width:100%;
  height:100%;
}

/* 손잡이 */
.zipper-head{
  position:absolute;
  left:50%;
  transform:translate(-50%,0);
  top:0;
  width:42px;
  height:60px;
  cursor:grab;
  z-index:20;
}

.zipper-head .metal{
  width:100%;
  height:100%;
  background:linear-gradient(145deg,#f5f5f5,#9a9a9a 40%,#666);
  border-radius:8px;
  box-shadow:0 5px 20px rgba(0,0,0,0.5);
  position:relative;
}

.zipper-head .ring{
  position:absolute;
  width:20px;
  height:20px;
  border:3px solid #ccc;
  border-radius:50%;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
}

/* ===== 내부 로고 ===== */
.logo{
  font-size:50px;
  letter-spacing:0.5em;
  margin-bottom:25px;
  opacity:0;
  transition:1s;
}

.menu{
  opacity:0;
  transition:1s;
}

.menu a{
  color:white;
  text-decoration:none;
  letter-spacing:0.4em;
  font-size:14px;
}

/* ===== 카테고리 ===== */
.category-layer{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(2,260px);
  grid-template-rows:repeat(2,360px);
  justify-content:center;
  align-content:center;
  gap:60px 80px;
  opacity:0;
  pointer-events:none;
  transition:0.8s;
}

.frame{
  position:relative;
  border:1px solid rgba(255,255,255,0.3);
  overflow:hidden;
  cursor:pointer;
  opacity:0;
  transform:translateY(40px);
  transition:0.6s;
}

.frame-inner{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,#222,#000);
}

.frame span{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  letter-spacing:0.4em;
}

.frame.expand{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  border:none;
  z-index:1000;
}

/* ===== 상세 ===== */
.category-detail{
  position:absolute;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  letter-spacing:0.3em;
  opacity:0;
  transition:1s;
}

</style>
</head>
<body>

<div class="denim"></div>

<!-- 지퍼 -->
<div class="zipper">
<svg viewBox="0 0 40 1000" preserveAspectRatio="none">
  <rect x="18" y="0" width="4" height="1000" fill="#bbb"/>
  <!-- 톱니 -->
  <g fill="#ddd">
    <rect x="10" y="0" width="10" height="6"/>
    <rect x="20" y="6" width="10" height="6"/>
    <rect x="10" y="12" width="10" height="6"/>
    <rect x="20" y="18" width="10" height="6"/>
    <!-- 반복 느낌 -->
  </g>
</svg>
</div>

<div class="zipper-head">
  <div class="metal">
    <div class="ring"></div>
  </div>
</div>

<!-- 내부 -->
<div class="inside">
  <div class="logo">NOMADETP</div>
  <div class="menu">
    <a href="#">COLLECTION</a>
  </div>

  <div class="category-layer">
    <div class="frame" data-cat="TOP"><div class="frame-inner"></div><span>TOP</span></div>
    <div class="frame" data-cat="BOTTOM"><div class="frame-inner"></div><span>BOTTOM</span></div>
    <div class="frame" data-cat="SET"><div class="frame-inner"></div><span>SET</span></div>
    <div class="frame" data-cat="ACCESSORY"><div class="frame-inner"></div><span>ACCESSORY</span></div>
  </div>

  <div class="category-detail"></div>
</div>

<script>

const zipperHead=document.querySelector(".zipper-head");
const inside=document.querySelector(".inside");
const logo=document.querySelector(".logo");
const menu=document.querySelector(".menu");

let dragging=false;
let opened=false;

function openZipper(){
  inside.classList.add("open");
  zipperHead.style.opacity=0;
  opened=true;
  setTimeout(()=>{
    logo.style.opacity=1;
    menu.style.opacity=1;
  },800);
}

function move(y){
  if(opened) return;
  zipperHead.style.top=y+"px";
  if(y>window.innerHeight*0.4){
    openZipper();
  }
}

zipperHead.addEventListener("mousedown",()=>dragging=true);
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",(e)=>{
  if(dragging) move(e.clientY);
});

zipperHead.addEventListener("touchstart",()=>dragging=true);
window.addEventListener("touchend",()=>dragging=false);
window.addEventListener("touchmove",(e)=>{
  if(dragging) move(e.touches[0].clientY);
});

/* 메뉴 */
const menuBtn=document.querySelector(".menu a");
const categoryLayer=document.querySelector(".category-layer");
const frames=document.querySelectorAll(".frame");
const detail=document.querySelector(".category-detail");

menuBtn.addEventListener("click",(e)=>{
  e.preventDefault();
  categoryLayer.style.opacity=1;
  categoryLayer.style.pointerEvents="auto";
  logo.style.opacity=0;
  menu.style.opacity=0;

  frames.forEach((f,i)=>{
    setTimeout(()=>{
      f.style.opacity=1;
      f.style.transform="translateY(0)";
    },i*150);
  });
});

/* 액자 클릭 */
frames.forEach(frame=>{
  frame.addEventListener("click",()=>{
    frames.forEach(f=>{
      if(f!==frame) f.style.opacity=0;
    });
    frame.classList.add("expand");
    setTimeout(()=>{
      detail.innerHTML=frame.dataset.cat;
      detail.style.opacity=1;
    },700);
  });
});

</script>
</body>
</html>
