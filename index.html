<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOMADE:TP | Official</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Pretendard', sans-serif; touch-action: none; }

        /* [1] 고정된 배경 콘텐츠 */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1; background: #050505;
        }
        .brand-logo { 
            font-size: clamp(2rem, 10vw, 3.5rem); color: #fff; letter-spacing: 15px; 
            font-weight: 100; opacity: 1; /* 가려진 상태에서 지퍼로 확인하는 것이므로 기본 opacity 1 */
        }
        .menu-list { 
            list-style: none; padding: 0; margin-top: 40px; text-align: center; color: #fff;
        }
        .menu-list li { margin: 15px 0; font-size: 0.9rem; letter-spacing: 5px; text-transform: uppercase; }

        /* [2] 화면을 꽉 채운 데님 레이어 (가만히 고정) */
        .zipper-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .denim-side { 
            position: absolute; top: 0; width: 50.5%; height: 100%; 
            background-image: url('https://images.unsplash.com/photo-1541099649105-f69ad21f3246?ixlib=rb-1.2.1&auto=format&fit=crop&w=2000&q=90');
            background-size: cover;
            background-repeat: no-repeat;
            will-change: clip-path;
        }
        .left-denim { left: 0; background-position: left center; border-right: 1px solid rgba(255,255,255,0.05); }
        .right-denim { right: 0; background-position: right center; border-left: 1px solid rgba(255,255,255,0.05); }

        /* 빈티지 지퍼 이빨 */
        .left-denim::after, .right-denim::after {
            content: ''; position: absolute; top: 0; width: 14px; height: 100%;
            background: repeating-linear-gradient(to bottom, #111 0px, #111 4px, #5d4a37 5px, #111 6px);
            background-size: 100% 10px;
        }
        .left-denim::after { right: -1px; }
        .right-denim::after { left: -1px; }

        /* [3] 녹슨 지퍼 손잡이 */
        #puller {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, 0);
            width: 50px; height: 110px; z-index: 20; cursor: grab; pointer-events: auto;
        }
        .puller-tab {
            width: 38px; height: 70px; background: linear-gradient(145deg, #5d4a37, #2c1e14);
            margin: 0 auto; border-radius: 4px; border: 1px solid #111;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center;
        }
        .puller-tab::after { content: 'TP'; color: #000; font-weight: 900; font-size: 13px; opacity: 0.3; }
    </style>
</head>
<body>

    <div class="content-layer">
        <div class="brand-logo">NOMADE:TP</div>
        <ul class="menu-list">
            <li>New Expedition</li>
            <li>Lookbook '26</li>
            <li>Store</li>
            <li>Contact</li>
        </ul>
    </div>

    <div class="zipper-container">
        <div class="denim-side left-denim" id="left"></div>
        <div class="denim-side right-denim" id="right"></div>
    </div>
    
    <div id="puller"><div class="puller-tab"></div></div>

    <script>
        const puller = document.getElementById('puller');
        const left = document.getElementById('left');
        const right = document.getElementById('right');
        const h = window.innerHeight;

        let isDragging = false;
        let startY = 0;
        let currentY = 0;

        const updateVisuals = (y) => {
            let p = (y / h) * 100;
            if (p < 0) p = 0;
            if (p > 95) p = 95;

            puller.style.top = y + 'px';

            // [핵심] 로고가 가려지지 않을 만큼만 벌어지는 너비
            // 지퍼 위치(p%)까지만 원단이 벌어지며 하단은 여전히 닫혀 있음
            const gap = p / 2.8; 
            
            left.style.clipPath = `polygon(0% 0%, ${100 - gap}% 0%, 100% ${p}%, 100% 100%, 0% 100%)`;
            right.style.clipPath = `polygon(${gap}% 0%, 100% 0%, 100% 100%, 0% 100%, 0% ${p}%)`;
        };

        const onStart = (e) => {
            isDragging = true;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            startY = clientY - currentY;
            puller.style.transition = "none";
            left.style.transition = "none";
            right.style.transition = "none";
        };

        const onMove = (e) => {
            if (!isDragging) return;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            currentY = clientY - startY;
            if (currentY < 0) currentY = 0;
            if (currentY > h * 0.95) currentY = h * 0.95;
            updateVisuals(currentY);

            // 살짝 내리면 자동으로 끝까지 내려가는 동작 유지
            if (currentY > h * 0.15 && isDragging) {
                isDragging = false;
                const duration = "1.5s cubic-bezier(0.15, 0, 0.15, 1)";
                puller.style.transition = `top ${duration}`;
                left.style.transition = `clip-path ${duration}`;
                right.style.transition = `clip-path ${duration}`;
                currentY = h * 0.92;
                updateVisuals(currentY);
            }
        };

        const onEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            if (currentY < h * 0.15) {
                const duration = "0.5s ease-out";
                puller.style.transition = `top ${duration}`;
                left.style.transition = `clip-path ${duration}`;
                right.style.transition = `clip-path ${duration}`;
                currentY = 0;
                updateVisuals(0);
            }
        };

        puller.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        puller.addEventListener('touchstart', onStart, {passive: false});
        window.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('touchend', onEnd);
    </script>
</body>
</html>
