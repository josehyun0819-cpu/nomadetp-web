<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOMADE:TP | Official</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Pretendard', sans-serif; }

        /* [핵심] 이미지 없이 CSS로 만든 데님 질감 */
        .denim-side { 
            width: 50%; height: 100%; 
            background-color: #1a2a44; /* 베이스 딥 블루 */
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,.05) 50%, transparent 50%),
                linear-gradient(rgba(255,255,255,.05) 50%, transparent 50%),
                radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 100%);
            background-size: 3px 3px, 3px 3px, 100% 100%; /* 미세한 격자 무늬로 원단 느낌 생성 */
            position: relative; transition: transform 0.15s ease-out;
            border-bottom: 5px solid #111;
        }

        /* 지퍼 안쪽 블랙 홀 */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1; background: #000;
        }

        .brand-logo { 
            font-size: clamp(2rem, 10vw, 4rem); color: #fff; letter-spacing: 12px; 
            opacity: 0; transform: scale(0.9); transition: 1s ease-out;
            font-weight: 200; margin-bottom: 30px;
        }

        .menu-list { list-style: none; padding: 0; text-align: center; }
        .menu-list li { 
            font-size: 1rem; margin: 20px 0; color: #555; cursor: pointer;
            opacity: 0; transform: translateY(15px); transition: 0.8s;
            letter-spacing: 4px; text-transform: uppercase;
        }
        .menu-list li.visible { opacity: 1; transform: translateY(0); }
        .menu-list li:hover { color: #fff; letter-spacing: 6px; }

        /* 지퍼 디테일 */
        .zipper-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; }
        .left-denim { border-right: 2px solid #555; }
        .right-denim { border-left: 2px solid #555; }

        .left-denim::after, .right-denim::after {
            content: ''; position: absolute; top: 0; width: 14px; height: 100%;
            background: repeating-linear-gradient(to bottom, #444 0px, #444 4px, #888 5px, #444 6px);
            background-size: 100% 8px;
        }
        .left-denim::after { right: 0; }
        .right-denim::after { left: 0; }

        /* 손잡이 (Puller) */
        #puller {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, 0);
            width: 46px; height: 80px; z-index: 20; cursor: grab;
        }
        .puller-body { width: 100%; height: 30px; background: #444; border-radius: 4px; }
        .puller-tab {
            width: 30px; height: 50px; background: #666; margin: -5px auto; border-radius: 3px;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .puller-tab::before { content: 'TP'; color: #111; font-weight: 900; font-size: 12px; }

        .guide { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); color: #fff; z-index: 25; font-size: 10px; letter-spacing: 5px; opacity: 0.3; }
    </style>
</head>
<body>

    <div class="content-layer">
        <div class="brand-logo" id="logo">NOMADE:TP</div>
        <ul class="menu-list">
            <li class="m-item">New Expedition</li>
            <li class="m-item">Lookbook '26</li>
            <li class="m-item">Store</li>
            <li class="m-item">Contact</li>
        </ul>
    </div>

    <div class="zipper-wrapper">
        <div class="denim-side left-denim" id="left"></div>
        <div class="denim-side right-denim" id="right"></div>
        <div id="puller">
            <div class="puller-body"></div>
            <div class="puller-tab"></div>
        </div>
    </div>

    <div class="guide">PULL DOWN</div>

    <audio id="zip-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script>
        const puller = document.getElementById('puller');
        const left = document.getElementById('left');
        const right = document.getElementById('right');
        const logo = document.getElementById('logo');
        const items = document.querySelectorAll('.m-item');
        const sound = document.getElementById('zip-sound');

        let isDragging = false;

        const move = (clientY) => {
            const h = window.innerHeight;
            let p = (clientY / h) * 100;
            if (p < 0) p = 0; if (p > 90) p = 90;

            puller.style.top = p + '%';
            left.style.transform = `translateX(-${p}%) rotate(-${p/20}deg)`;
            right.style.transform = `translateX(${p}%) rotate(${p/20}deg)`;

            if (p > 10) {
                logo.style.opacity = p / 100;
                items.forEach((item, i) => setTimeout(() => item.classList.add('visible'), i * 150));
                if (sound.paused) { sound.volume = 0.1; sound.play().catch(() => {}); }
            }
        };

        puller.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => { isDragging = false; sound.pause(); });
        window.addEventListener('mousemove', (e) => isDragging && move(e.clientY));
        puller.addEventListener('touchstart', (e) => { isDragging = true; e.preventDefault(); });
        window.addEventListener('touchend', () => { isDragging = false; sound.pause(); });
        window.addEventListener('touchmove', (e) => isDragging && move(e.touches[0].clientY), {passive: false});
    </script>
</body>
</html>
