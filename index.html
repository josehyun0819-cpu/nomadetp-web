<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NOMADETP</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  overflow:hidden;
  background:#000;
  font-family:"Cormorant Garamond",serif;
}

/* ================= 데님 ================= */

.denim-left,
.denim-right{
  position:fixed;
  top:0;
  width:50%;
  height:100%;
  background:
    repeating-linear-gradient(
      90deg,
      #1c2d44 0px,
      #1c2d44 2px,
      #1a2a3f 2px,
      #1a2a3f 4px
    );
  transition:transform 0.12s linear;
  z-index:2;
}

.denim-left{left:0;}
.denim-right{right:0;}

.denim-left{
  transform:translateX(calc(-100% * var(--progress,0)));
}
.denim-right{
  transform:translateX(calc(100% * var(--progress,0)));
}

/* ================= 중앙 지퍼 라인 ================= */

.zipper-line{
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:10px;
  height:100%;
  background:
    repeating-linear-gradient(
      to bottom,
      #d6d6d6 0px,
      #a5a5a5 6px,
      #5c5c5c 12px
    );
  z-index:3;
  transition:opacity 0.4s ease;
}

/* ================= 지퍼 헤드 ================= */

.zipper-head{
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  width:42px;
  height:60px;
  cursor:grab;
  z-index:4;
}

.metal{
  width:100%;
  height:100%;
  background:linear-gradient(#dcdcdc,#8e8e8e);
  border-radius:6px;
}

/* ================= 내부 ================= */

.inside{
  position:absolute;
  inset:0;
  background:#0b0b0b;
  display:flex;
  justify-content:center;
  align-items:center;
  clip-path:polygon(50% 0%,50% 0%,50% 100%,50% 100%);
  transition:clip-path 0.8s ease;
  z-index:1;
}

.inside.open{
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
}

/* ================= 로고 ================= */

.logo{
  opacity:0;
  transform:translateY(25px);
  transition:opacity 0.8s ease, transform 0.8s ease;
}

.logo.show{
  opacity:1;
  transform:translateY(0);
}

.logo img{
  width:220px;
}
</style>
</head>
<body>

<div class="denim-left"></div>
<div class="denim-right"></div>

<div class="zipper-line"></div>

<div class="zipper-head">
  <div class="metal"></div>
</div>

<div class="inside">
  <div class="logo">
    <img src="./assets/logo.png" alt="NOMADETP">
  </div>
</div>

<script>
const zipper = document.querySelector(".zipper-head");
const inside = document.querySelector(".inside");
const logo = document.querySelector(".logo");
const zipperLine = document.querySelector(".zipper-line");

let dragging = false;
let opened = false;

function openZipper(){
  opened = true;
  inside.classList.add("open");
  zipperLine.style.opacity = 0;
  zipper.style.opacity = 0;

  setTimeout(()=>{
    logo.classList.add("show");
  },600);
}

function move(y){
  if(opened) return;
  let progress = Math.min(y / window.innerHeight, 1);
  document.body.style.setProperty("--progress", progress);
  zipper.style.top = (progress * window.innerHeight) + "px";

  if(progress > 0.45){
    openZipper();
  }
}

zipper.addEventListener("mousedown",()=>dragging=true);
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",(e)=>{
  if(dragging) move(e.clientY);
});

zipper.addEventListener("touchstart",()=>dragging=true);
window.addEventListener("touchend",()=>dragging=false);
window.addEventListener("touchmove",(e)=>{
  if(dragging) move(e.touches[0].clientY);
});
</script>

</body>
</html>
