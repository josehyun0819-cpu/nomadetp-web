<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NOMADE:TP</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#000;
  overflow:hidden;
  height:200vh;
  font-family:"Inter",sans-serif;
}

/* ZIP SECTION */
.zip-section{
  position:fixed;
  top:0;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* INSIDE */
.inside{
  position:absolute;
  inset:0;
  background:#0f0f0f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1;
  perspective:1000px;
}

.logo{
  font-family:"Cormorant Garamond",serif;
  font-size:42px;
  letter-spacing:0.4em;
  color:white;
  margin-bottom:30px;
  opacity:0;
  transform:translateY(40px);
  transition:1s ease;
}

.menu{
  display:flex;
}

.menu a{
  font-size:14px;
  color:#ccc;
  margin:0 14px;
  text-decoration:none;
  opacity:0;
  transition:1s ease;
}

/* DENIM */
.denim{
  position:absolute;
  top:0;
  width:50%;
  height:100%;
  background:url('./assets/denim.jpg') center/cover no-repeat;
  z-index:2;
  transition:transform 0.2s ease-out;
  animation:denimMove 20s linear infinite;
}

@keyframes denimMove{
  0%{background-position:50% 50%;}
  50%{background-position:52% 48%;}
  100%{background-position:50% 50%;}
}

.left{left:0;}
.right{right:0;}

/* ZIPPER */
.zipper-line{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  height:100%;
  width:10px;
  background:repeating-linear-gradient(
    to bottom,
    #bbb 0px,
    #bbb 6px,
    #888 6px,
    #888 12px
  );
  z-index:3;
  transition:opacity 0.4s ease;
}

.zip-handle{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:24px;
  height:32px;
  background:linear-gradient(#ddd,#999);
  border-radius:6px;
  box-shadow:0 6px 18px rgba(0,0,0,0.7);
  cursor:grab;
  z-index:4;
  transition:opacity 0.4s ease;
}
</style>
</head>

<body>

<section class="zip-section">

<div class="inside">
  <h1 class="logo">N O M A D E : T P</h1>
  <nav class="menu">
    <a href="#">New Expedition</a>
    <a href="#">Lookbook ’26</a>
    <a href="#">Store</a>
    <a href="#">Contact</a>
  </nav>
</div>

<div class="denim left"></div>
<div class="denim right"></div>

<div class="zipper-line"></div>
<div class="zip-handle"></div>

</section>

<script>
const handle=document.querySelector(".zip-handle");
const zipperLine=document.querySelector(".zipper-line");
const left=document.querySelector(".left");
const right=document.querySelector(".right");
const logo=document.querySelector(".logo");
const menuLinks=document.querySelectorAll(".menu a");
const inside=document.querySelector(".inside");

let isDragging=false;
let maxHeight=window.innerHeight;
let currentY=0;
let opened=false;

/* 사운드 */
function playZipSound(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sawtooth";
  osc.frequency.value=130;
  gain.gain.setValueAtTime(0.05,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.4);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+0.4);
}

/* 업데이트 */
function update(progress){

  if(progress<0.15){
    progress*=0.5;
  }

  /* 90% 근처 진동 */
  if(progress>0.9 && progress<0.98){
    handle.style.transform=
      `translateX(-50%) translateY(${Math.sin(Date.now()*0.05)*3}px)`;
  }else{
    handle.style.transform="translateX(-50%)";
  }

  left.style.transform=`translateX(-${progress*100}%)`;
  right.style.transform=`translateX(${progress*100}%)`;
  handle.style.top=`${progress*maxHeight}px`;

  if(progress>0.6){
    logo.style.opacity=1;
    logo.style.transform="translateY(0)";
    menuLinks.forEach((link,i)=>{
      setTimeout(()=>{link.style.opacity=1;},i*100);
    });
  }

  if(progress>=1){
    zipperLine.style.opacity=0;
    handle.style.opacity=0;
    document.body.style.overflow="auto";
  }
}

/* 자동 오픈 */
function autoOpen(){
  if(opened) return;
  opened=true;
  playZipSound();
  let progress=currentY/maxHeight;

  function animate(){
    progress+=0.04;
    if(progress>=1) progress=1;
    update(progress);
    if(progress<1){
      requestAnimationFrame(animate);
    }
  }
  requestAnimationFrame(animate);
}

/* 드래그 */
handle.addEventListener("mousedown",()=>{
  if(opened) return;
  isDragging=true;
  handle.style.cursor="grabbing";
});

window.addEventListener("mouseup",()=>{
  if(isDragging && currentY>maxHeight*0.1){
    autoOpen();
  }
  isDragging=false;
  handle.style.cursor="grab";
});

window.addEventListener("mousemove",(e)=>{
  if(!isDragging||opened) return;
  let y=e.clientY;
  currentY=Math.max(0,Math.min(maxHeight,y));
  update(currentY/maxHeight);
});

/* 모바일 */
window.addEventListener("touchstart",(e)=>{
  if(opened) return;
  isDragging=true;
  currentY=e.touches[0].clientY;
});

window.addEventListener("touchmove",(e)=>{
  if(!isDragging||opened) return;
  let y=e.touches[0].clientY;
  currentY=Math.max(0,Math.min(maxHeight,y));
  update(currentY/maxHeight);
});

window.addEventListener("touchend",()=>{
  if(isDragging && currentY>maxHeight*0.1){
    autoOpen();
  }
  isDragging=false;
});

/* === 패럴랙스 === */
document.addEventListener("mousemove",(e)=>{
  if(!opened) return;
  const x=(e.clientX/window.innerWidth-0.5)*10;
  const y=(e.clientY/window.innerHeight-0.5)*10;
  logo.style.transform=`translate(${x}px,${y}px)`;
  document.querySelector(".menu").style.transform=
    `translate(${x*0.6}px,${y*0.6}px)`;
});
</script>

</body>
</html>
