<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOMADE:TP | Official</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Pretendard', sans-serif; touch-action: none; }

        /* 내부 콘텐츠 */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1; background: #050505;
        }
        .brand-logo { font-size: clamp(2rem, 10vw, 3.5rem); color: #fff; letter-spacing: 15px; font-weight: 100; opacity: 0; transition: 1s; }
        .menu-list { list-style: none; padding: 0; margin-top: 40px; text-align: center; color: #fff; letter-spacing: 5px; font-size: 0.9rem; line-height: 2.5; opacity: 0; transition: 1s; }

        /* 리얼 데님 배경 (여자바지 워싱 블루) */
        .zipper-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        .denim-side { 
            position: absolute; top: 0; width: 55%; height: 100%; 
            /* 실제 청바지 사진 질감을 위한 멀티 레이어 배경 */
            background-color: #354a65;
            background-image: 
                radial-gradient(circle at 80% 40%, rgba(255,255,255,0.12) 0%, transparent 50%), /* 허벅지 워싱 느낌 */
                url('https://www.transparenttextures.com/patterns/denim.png'), /* 직물 결 */
                linear-gradient(90deg, rgba(0,0,0,0.4) 0%, transparent 10%, transparent 90%, rgba(0,0,0,0.4) 100%);
            background-blend-mode: overlay, normal, normal;
            will-change: clip-path;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }
        .left-denim { left: 0; border-right: 1px solid rgba(0,0,0,0.5); }
        .right-denim { right: 0; border-left: 1px solid rgba(0,0,0,0.5); }

        /* 녹슨 지퍼 이빨 (빈티지 황동) */
        .left-denim::after, .right-denim::after {
            content: ''; position: absolute; top: 0; width: 16px; height: 100%;
            background: repeating-linear-gradient(to bottom, #1a1a1a 0px, #1a1a1a 4px, #7a5c3d 5px, #1a1a1a 6px);
            background-size: 100% 10px;
        }
        .left-denim::after { right: 0; box-shadow: -2px 0 5px rgba(0,0,0,0.5); }
        .right-denim::after { left: 0; box-shadow: 2px 0 5px rgba(0,0,0,0.5); }

        /* 빈티지 녹슨 지퍼 손잡이 */
        #puller {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, -10px);
            width: 54px; height: 110px; z-index: 20; cursor: grab;
        }
        .puller-tab {
            width: 38px; height: 70px; 
            background: linear-gradient(145deg, #7a5c3d, #2c1e14); /* 실제 녹슨 금속 색상 */
            margin: 10px auto; border-radius: 4px; border: 1px solid #1a110a;
            box-shadow: 0 15px 30px rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        .puller-tab::before { content: ''; position: absolute; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.3; pointer-events: none; }
        .puller-tab::after { content: 'TP'; color: #000; font-weight: 900; font-size: 14px; opacity: 0.3; }

        .guide { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); color: #fff; z-index: 25; font-size: 10px; letter-spacing: 5px; opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>

    <div class="content-layer">
        <div class="brand-logo" id="logo">NOMADE:TP</div>
        <ul class="menu-list" id="menu">
            <li>New Expedition</li>
            <li>Lookbook '26</li>
            <li>Store</li>
            <li>Contact</li>
        </ul>
    </div>

    <div class="zipper-container">
        <div class="denim-side left-denim" id="left"></div>
        <div class="denim-side right-denim" id="right"></div>
        <div id="puller">
            <div class="puller-tab"></div>
        </div>
    </div>

    <div class="guide" id="guide">PULL DOWN</div>

    <script>
        const puller = document.getElementById('puller');
        const left = document.getElementById('left');
        const right = document.getElementById('right');
        const logo = document.getElementById('logo');
        const menu = document.getElementById('menu');
        const guide = document.getElementById('guide');
        const h = window.innerHeight;

        let isDragging = false;
        let startY = 0;
        let currentY = 0;

        const render = (y) => {
            let p = (y / h) * 100;
            if (p < 0) p = 0; if (p > 90) p = 90;

            puller.style.top = y + 'px';
            // 지퍼 위치에 맞춰 실시간으로 원단이 벌어지는 V자 (하단 고정)
            const gap = p / 5.5; 
            left.style.clipPath = `polygon(0% 0%, ${100-gap}% 0%, 100% ${p}%, 100% 100%, 0% 100%)`;
            right.style.clipPath = `polygon(${gap}% 0%, 100% 0%, 100% 100%, 0% 100%, 0% ${p}%)`;
            
            logo.style.opacity = p / 60;
            if(p > 50) menu.style.opacity = "1";
        };

        const onStart = (e) => {
            isDragging = true;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            startY = clientY - currentY;
            
            puller.style.transition = "none";
            left.style.transition = "none";
            right.style.transition = "none";
        };

        const onMove = (e) => {
            if (!isDragging) return;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const y = clientY - startY;
            if (y < 0) return;

            currentY = y;
            render(currentY);

            // 한 번 힘줘서 내리기 시작하면(20% 지점) 자동으로 쭈욱 내려감
            if (currentY > h * 0.15) {
                isDragging = false;
                autoFinish();
            }
        };

        const autoFinish = () => {
            currentY = h * 0.82;
            const duration = "1.2s cubic-bezier(0.2, 0, 0.2, 1)";
            puller.style.transition = `top ${duration}`;
            left.style.transition = `clip-path ${duration}`;
            right.style.transition = `clip-path ${duration}`;
            render(currentY);
            guide.style.opacity = "0";
        };

        const onEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            if (currentY < h * 0.15) {
                currentY = 0;
                puller.style.transition = "all 0.4s ease-out";
                render(0);
            }
        };

        puller.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        puller.addEventListener('touchstart', onStart, {passive: false});
        window.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('touchend', onEnd);
    </script>
</body>
</html>
