<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOMADE:TP | Official</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Pretendard', sans-serif; }

        /* 배경 콘텐츠 */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1; background: #050505;
        }
        .brand-logo { 
            font-size: clamp(1.8rem, 8vw, 3rem); color: #fff; letter-spacing: 15px; 
            font-weight: 100; opacity: 0; transform: translateY(10px); transition: 1s;
        }
        .menu-list { list-style: none; padding: 0; margin-top: 40px; text-align: center; }
        .menu-list li { color: #444; margin: 15px 0; font-size: 0.8rem; letter-spacing: 4px; opacity: 0; transition: 0.8s; }

        /* 리얼 데님 배경 (오른쪽 여자 바지 느낌의 워싱 블루) */
        .zipper-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        .denim-side { 
            position: absolute; top: 0; width: 50%; height: 100%; 
            background-color: #3b5271;
            /* 데님 질감 + 페이딩 워싱 효과 */
            background-image: 
                radial-gradient(circle at 70% 50%, rgba(255,255,255,0.15) 0%, transparent 60%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 3px),
                url('https://www.transparenttextures.com/patterns/denim.png');
            will-change: clip-path;
        }
        .left-denim { left: 0; border-right: 1px solid rgba(0,0,0,0.3); }
        .right-denim { right: 0; border-left: 1px solid rgba(0,0,0,0.3); }

        /* 녹슬고 빈티지한 지퍼 디테일 */
        .left-denim::after, .right-denim::after {
            content: ''; position: absolute; top: 0; width: 14px; height: 100%;
            background: repeating-linear-gradient(to bottom, #222 0px, #222 4px, #5d4a37 5px, #222 6px); /* 황동색/녹슨 느낌 */
            background-size: 100% 10px;
        }
        .left-denim::after { right: 0; }
        .right-denim::after { left: 0; }

        /* 빈티지 지퍼 손잡이 (Brass/Rust 효과) */
        #puller {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, -20%);
            width: 50px; height: 100px; z-index: 20; cursor: grab;
            transition: top 0.1s linear;
        }
        .puller-tab {
            width: 34px; height: 65px; 
            background: linear-gradient(145deg, #5d4a37, #2c1e14); /* 녹슨 황동색 그라데이션 */
            margin: 10px auto; border-radius: 4px; border: 1px solid #1a110a;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            position: relative;
        }
        /* 지퍼 탭 위 부식된 질감 표현 */
        .puller-tab::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(139,69,19,0.3) 10%, transparent 70%);
        }
        .puller-tab::after { content: 'TP'; color: #000; font-weight: 900; font-size: 13px; opacity: 0.4; }

        .guide { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); color: #fff; z-index: 25; font-size: 10px; letter-spacing: 5px; opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

    <div class="content-layer">
        <div class="brand-logo" id="logo">NOMADE:TP</div>
        <ul class="menu-list" id="menus">
            <li>New Expedition</li>
            <li>Lookbook '26</li>
            <li>Store</li>
            <li>Contact</li>
        </ul>
    </div>

    <div class="zipper-container" id="container">
        <div class="denim-side left-denim" id="left"></div>
        <div class="denim-side right-denim" id="right"></div>
        <div id="puller">
            <div class="puller-tab"></div>
        </div>
    </div>

    <div class="guide" id="guide-text">PULL DOWN</div>

    <audio id="zip-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
