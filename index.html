<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NOMADETP</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* 기본 세팅 */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  overflow:hidden;
  font-family:"Cormorant Garamond",serif;
  background:#111;
  color:white;
}

/* 데님 배경 */
.denim{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06), transparent 40%),
    linear-gradient(135deg,#1f2f46,#16283c 40%,#1b3552);
  background-size:cover;
}

/* 지퍼 라인 */
.zipper-track{
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  width:6px;
  height:100%;
  background:linear-gradient(#aaa,#666);
  z-index:5;
}

/* 지퍼 손잡이 */
.zipper-head{
  position:absolute;
  left:50%;
  top:0;
  transform:translate(-50%,0);
  width:34px;
  height:48px;
  background:linear-gradient(145deg,#eee,#888);
  border-radius:6px;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
  cursor:grab;
  z-index:10;
}

/* 안쪽 공간 */
.inside{
  position:absolute;
  inset:0;
  background:#0d0d0d;
  clip-path:inset(0 50% 0 50%);
  transition:clip-path 1s cubic-bezier(.77,0,.18,1);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.inside.open{
  clip-path:inset(0 0 0 0);
}

/* 로고 */
.logo{
  font-size:48px;
  letter-spacing:0.5em;
  margin-bottom:20px;
  transition:0.6s;
}

/* 메뉴 */
.menu a{
  color:white;
  text-decoration:none;
  letter-spacing:0.3em;
  font-size:14px;
  transition:0.3s;
}

.menu a:hover{
  opacity:0.5;
}

/* 카테고리 레이어 */
.category-layer{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(2,260px);
  grid-template-rows:repeat(2,360px);
  justify-content:center;
  align-content:center;
  gap:60px 80px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.8s ease;
}

/* 액자 */
.frame{
  position:relative;
  border:1px solid rgba(255,255,255,0.3);
  overflow:hidden;
  cursor:pointer;
  transform:translateY(40px);
  opacity:0;
  transition:0.6s ease;
}

.frame-inner{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,#222,#000);
  transition:0.8s;
}

.frame span{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  letter-spacing:0.4em;
  font-size:14px;
}

.frame:hover .frame-inner{
  transform:scale(1.05);
}

.frame.expand{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  transform:none;
  z-index:1000;
  border:none;
}

.category-detail{
  position:absolute;
  inset:0;
  background:black;
  opacity:0;
  transition:0.8s;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  letter-spacing:0.3em;
}

</style>
</head>
<body>

<div class="denim"></div>
<div class="zipper-track"></div>
<div class="zipper-head"></div>

<div class="inside">
  <div class="logo">NOMADETP</div>
  <div class="menu">
    <a href="#">COLLECTION</a>
  </div>

  <div class="category-layer">
    <div class="frame" data-cat="TOP">
      <div class="frame-inner"></div>
      <span>TOP</span>
    </div>
    <div class="frame" data-cat="BOTTOM">
      <div class="frame-inner"></div>
      <span>BOTTOM</span>
    </div>
    <div class="frame" data-cat="SET">
      <div class="frame-inner"></div>
      <span>SET</span>
    </div>
    <div class="frame" data-cat="ACCESSORY">
      <div class="frame-inner"></div>
      <span>ACCESSORY</span>
    </div>
  </div>

  <div class="category-detail"></div>
</div>

<script>

const zipper = document.querySelector(".zipper-head");
const track = document.querySelector(".zipper-track");
const inside = document.querySelector(".inside");

let isDragging=false;
let opened=false;

function openZipper(){
  inside.classList.add("open");
  track.style.opacity=0;
  zipper.style.opacity=0;
  opened=true;
}

function handleMove(y){
  if(opened) return;
  zipper.style.top = y+"px";
  if(y > window.innerHeight*0.35){
    openZipper();
  }
}

zipper.addEventListener("mousedown",()=>isDragging=true);
window.addEventListener("mouseup",()=>isDragging=false);
window.addEventListener("mousemove",(e)=>{
  if(isDragging) handleMove(e.clientY);
});

zipper.addEventListener("touchstart",()=>isDragging=true);
window.addEventListener("touchend",()=>isDragging=false);
window.addEventListener("touchmove",(e)=>{
  if(isDragging) handleMove(e.touches[0].clientY);
});

/* 메뉴 */
const menuBtn=document.querySelector(".menu a");
const categoryLayer=document.querySelector(".category-layer");
const frames=document.querySelectorAll(".frame");
const logo=document.querySelector(".logo");
const detail=document.querySelector(".category-detail");

menuBtn.addEventListener("click",(e)=>{
  e.preventDefault();
  categoryLayer.style.opacity=1;
  categoryLayer.style.pointerEvents="auto";
  logo.style.opacity=0;
  document.querySelector(".menu").style.opacity=0;

  frames.forEach((frame,i)=>{
    setTimeout(()=>{
      frame.style.opacity=1;
      frame.style.transform="translateY(0)";
    }, i*150);
  });
});

/* 액자 클릭 */
frames.forEach(frame=>{
  frame.addEventListener("click",()=>{
    frames.forEach(f=>{
      if(f!==frame){
        f.style.opacity=0;
      }
    });
    frame.classList.add("expand");

    setTimeout(()=>{
      detail.innerHTML=frame.dataset.cat;
      detail.style.opacity=1;
    },700);
  });
});

</script>

</body>
</html>
