<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOMADE:TP | Official Store</title>
    <style>
        :root { 
            --zipper-metal: #777; 
            --denim-texture: url('https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=2000');
        }
        
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        /* 1. 내부 콘텐츠 (지퍼가 열리면 보이는 곳) */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1; background: #000; /* 순수 블랙 배경으로 로고 강조 */
        }
        
        .brand-logo { 
            font-size: clamp(2rem, 10vw, 4rem); color: #fff; letter-spacing: 15px; 
            opacity: 0; transform: scale(0.8); transition: 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 200; margin-bottom: 40px;
        }
        
        .menu-list { list-style: none; padding: 0; text-align: center; }
        .menu-list li { 
            font-size: 1rem; margin: 25px 0; color: #444; cursor: pointer;
            opacity: 0; transform: translateY(20px); transition: 0.8s;
            letter-spacing: 5px; text-transform: uppercase; font-weight: 300;
        }
        .menu-list li.visible { opacity: 1; transform: translateY(0); }
        .menu-list li:hover { color: #fff; letter-spacing: 7px; transition: 0.3s; }

        /* 2. 풀 데님 지퍼 레이어 */
        .zipper-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; }
        
        .denim-side { 
            width: 50%; height: 100%; 
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), var(--denim-texture);
            background-size: cover; background-position: center;
            position: relative; transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* 금속 지퍼 이빨 (Metal Teeth) */
        .left-denim::after, .right-denim::after {
            content: ''; position: absolute; top: 0; width: 12px; height: 100%;
            background-image: linear-gradient(to bottom, #333 0%, #888 25%, #222 50%, #777 75%, #111 100%);
            background-size: 100% 10px;
        }
        .left-denim { border-right: 1px solid #000; }
        .left-denim::after { right: 0; }
        .right-denim { border-left: 1px solid #000; }
        .right-denim::after { left: 0; }

        /* 3. 브랜드 로고 지퍼 손잡이 */
        #puller {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, 0);
            width: 50px; height: 85px; z-index: 20; cursor: grab;
        }
        .puller-body {
            width: 100%; height: 35px; background: linear-gradient(145deg, #555, #111);
            border-radius: 4px; border: 1px solid #000;
        }
        .puller-tab {
            width: 34px; height: 50px; background: linear-gradient(145deg, #666, #222);
            margin: -3px auto 0; border-radius: 3px; border: 1px solid #000;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7);
        }
        .puller-tab::after { content: 'TP'; color: #000; font-weight: 900; font-size: 13px; opacity: 0.8; }

        /* 하단 가이드 */
        .guide-text {
            position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
            color: #fff; z-index: 25; font-size: 10px; letter-spacing: 5px;
            opacity: 0.4; animation: blink 2s infinite; pointer-events: none;
        }
        @keyframes blink { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div class="content-layer">
        <div class="brand-logo" id="logo">NOMADE:TP</div>
        <ul class="menu-list">
            <li class="m-item">New Expedition</li>
            <li class="m-item">Lookbook '26</li>
            <li class="m-item">Store</li>
            <li class="m-item">Contact</li>
        </ul>
    </div>

    <div class="zipper-wrapper">
        <div class="denim-side left-denim" id="left"></div>
        <div class="denim-side right-denim" id="right"></div>
        <div id="puller">
            <div class="puller-body"></div>
            <div class="puller-tab"></div>
        </div>
    </div>

    <div class="guide-text">UNZIP TO EXPLORE</div>

    <audio id="zip-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script>
        const puller = document.getElementById('puller');
        const left = document.getElementById('left');
        const right = document.getElementById('right');
        const logo = document.getElementById('logo');
        const items = document.querySelectorAll('.m-item');
        const sound = document.getElementById('zip-sound');

        let isDragging = false;
        let lastY = 0;

        const handleMove = (clientY) => {
            const h = window.innerHeight;
            let percent = (clientY / h) * 100;
            if (percent < 0) percent = 0;
            if (percent > 88) percent = 88;

            puller.style.top = percent + '%';
            
            // 지퍼가 위에서부터 사선으로 벌어지는 물리 효과
            left.style.transformOrigin = "top right";
            right.style.transformOrigin = "top left";
            left.style.transform = `translateX(-${percent}%) rotate(-${percent/15}deg)`;
            right.style.transform = `translateX(${percent}%) rotate(${percent/15}deg)`;

            // 사운드 재생
            if (Math.abs(clientY - lastY) > 15) {
                if (sound.paused) {
                    sound.volume = 0.1;
                    sound.play().catch(() => {});
                }
                lastY = clientY;
            }

            // 브랜드명 및 메뉴 등장 디테일
            if (percent > 10) {
                logo.style.opacity = percent / 90;
                logo.style.transform = `scale(${0.95 + (percent/1000)})`;
                items.forEach((item, i) => {
                    setTimeout(() => item.classList.add('visible'), i * 150);
                });
            } else {
                logo.style.opacity = 0;
                items.forEach(item => item.classList.remove('visible'));
            }
        };

        // 드래그 이벤트 통합 (PC/Mobile)
        const start = () => { isDragging = true; };
        const end = () => { isDragging = false; sound.pause(); };

        puller.addEventListener('mousedown', start);
        window.addEventListener('mouseup', end);
        window.addEventListener('mousemove', (e) => isDragging && handleMove(e.clientY));

        puller.addEventListener('touchstart', (e) => { start(); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', end);
        window.addEventListener('touchmove', (e) => isDragging && handleMove(e.touches[0].clientY), {passive: false});
    </script>
</body>
</html>
