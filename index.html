<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOMADE:TP | Official</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Pretendard', sans-serif; touch-action: none; }

        /* 내부 콘텐츠 */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1; background: #000;
        }
        .brand-logo { 
            font-size: clamp(2rem, 10vw, 3.5rem); color: #fff; letter-spacing: 15px; 
            font-weight: 100; opacity: 0; transform: scale(0.9); transition: 1.5s ease-out;
        }
        .menu-list { list-style: none; padding: 0; margin-top: 30px; text-align: center; }
        .menu-list li { 
            font-size: 1rem; margin: 20px 0; color: #fff; opacity: 0; 
            transform: translateY(20px); transition: 1s; letter-spacing: 5px; text-transform: uppercase;
        }
        .menu-list li.visible { opacity: 1; transform: translateY(0); }

        /* 리얼 데님 배경 (여자바지 느낌) */
        .zipper-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; pointer-events: none; }
        
        .denim-side { 
            width: 50%; height: 100%; 
            background-color: #2c3e5a; /* 이미지의 딥블루 워싱 컬러 */
            background-image: 
                radial-gradient(circle at 80% 40%, rgba(255,255,255,0.1) 0%, transparent 60%),
                url('https://www.transparenttextures.com/patterns/denim.png');
            position: relative;
            transform-origin: bottom center; /* 하단 고정 V자 */
            transition: transform 1.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }
        .left-denim { border-right: 1px solid #111; transform-origin: bottom right; }
        .right-denim { border-left: 1px solid #111; transform-origin: bottom left; }

        /* 녹슨 지퍼 이빨 */
        .left-denim::after, .right-denim::after {
            content: ''; position: absolute; top: 0; width: 12px; height: 100%;
            background: repeating-linear-gradient(to bottom, #111 0px, #111 4px, #6e553d 5px, #111 6px);
            background-size: 100% 10px;
        }
        .left-denim::after { right: -1px; }
        .right-denim::after { left: -1px; }

        /* 녹슨 지퍼 손잡이 */
        #puller {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, 0);
            width: 50px; height: 90px; z-index: 20; cursor: grab;
            transition: top 0s; 
        }
        #puller.auto-gliding { transition: top 1.4s cubic-bezier(0.25, 1, 0.5, 1); }

        .puller-tab {
            width: 36px; height: 60px; 
            background: linear-gradient(145deg, #6e553d, #251a11); /* 빈티지 녹슨 황동 */
            margin: 10px auto; border-radius: 4px; border: 1px solid #111;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .puller-tab::after { content: 'TP'; color: #000; font-weight: 900; font-size: 13px; opacity: 0.3; }

        .guide { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); color: #fff; z-index: 25; font-size: 10px; letter-spacing: 5px; opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>

    <div class="content-layer">
        <div class="brand-logo" id="logo">NOMADE:TP</div>
        <ul class="menu-list">
            <li class="m-item">New Expedition</li>
            <li class="m-item">Lookbook '26</li>
            <li class="m-item">Store</li>
            <li class="m-item">Contact</li>
        </ul>
    </div>

    <div class="zipper-wrapper">
        <div class="denim-side left-denim" id="left"></div>
        <div class="denim-side right-denim" id="right"></div>
    </div>
    
    <div id="puller">
        <div class="puller-tab"></div>
    </div>

    <div class="guide" id="guide-text">DRAG TO UNZIP</div>

    <script>
        const puller = document.getElementById('puller');
        const left = document.getElementById('left');
        const right = document.getElementById('right');
        const logo = document.getElementById('logo');
        const items = document.querySelectorAll('.m-item');
        const guide = document.getElementById('guide-text');

        let isDragging = false;
        let isOpened = false;
        let startY = 0;

        const startDragging = (e) => {
            if (isOpened) return;
            isDragging = true;
            startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            puller.style.cursor = 'grabbing';
            puller.style.transition = "none";
        };

        const stopDragging = () => {
            if (!isDragging || isOpened) return;
            isDragging = false;
            puller.style.cursor = 'grab';
            
            if (!isOpened) {
                puller.style.transition = "top 0.4s ease";
                puller.style.top = "0px";
            }
        };

        const doMove = (e) => {
            if (!isDragging || isOpened) return;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const diff = clientY - startY;

            if (diff > 0) {
                puller.style.top = diff + 'px';
                
                // 80px 이상 내리면 자동 실행 (일정한 속도로 쭈욱)
                if (diff > 80) {
                    isOpened = true;
                    isDragging = false;
                    triggerAutoOpen();
                }
            }
        };

        const triggerAutoOpen = () => {
            puller.classList.add('auto-gliding');
            puller.style.top = '80%';
            
            // 여자바지 느낌의 세련된 V자 각도 (이미지 참고)
            left.style.transform = "rotate(-8deg) translateX(-10%)";
            right.style.transform = "rotate(8deg) translateX(10%)";
            
            setTimeout(() => {
                logo.style.opacity = "1";
                logo.style.transform = "scale(1)";
                items.forEach((item, i) => {
                    setTimeout(() => item.classList.add('visible'), i * 150);
                });
            }, 400);

            guide.style.opacity = "0";
            puller.style.pointerEvents = "none";
        };

        puller.addEventListener('mousedown', startDragging);
        window.addEventListener('mouseup', stopDragging);
        window.addEventListener('mousemove', doMove);
        puller.addEventListener('touchstart', startDragging, {passive: false});
        window.addEventListener('touchend', stopDragging);
        window.addEventListener('touchmove', doMove, {passive: false});
    </script>
</body>
</html>
