<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NOMADE:TP</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:'Playfair Display', serif;
}

/* =========================================================
   ✅ 실사 데님: "사진(그대로) + 최소 보정"
   - 이미지 자체를 코드에 임베드해서 로딩/경로 실수 방지
========================================================= */
.denim-left,.denim-right{
  position:fixed;
  top:0;
  width:50%;
  height:100%;
  z-index:2;
  transition:transform 0.12s linear, opacity 0.4s ease;
  will-change:transform;

  /* 레이어 순서: 위 -> 아래 */
  background-image:
    /* (1) 살짝 비네팅(깊이) */
    radial-gradient(circle at 50% 55%, rgba(0,0,0,0) 44%, rgba(0,0,0,0.60) 100%),

    /* (2) 아주 약한 자연광 */
    radial-gradient(ellipse at 35% 18%, rgba(255,255,255,0.10), rgba(255,255,255,0) 56%),
    radial-gradient(ellipse at 70% 58%, rgba(255,255,255,0.06), rgba(255,255,255,0) 62%),

    /* ✅ (3) 너가 올린 이미지 그대로(임베드) */
    url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxAQEhAQEBAVFhAVFRUWFRUVFRUVFRUVFxUXFhUYHSggGBolGxUVITEhJSkrLi4uFx8zODMtNygtLisBCgoKDg0OGxAQGy0lICUtLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLf/AABEIAWgB4AMBIgACEQEDEQH/xAAbAAACAwEBAQAAAAAAAAAAAAAEBQIDBgEAB//EAD8QAAIBAgMFBQQIBQQDAAAAAAECAwQRAAUSITFBBhMiUWFxgZEykaGxQlKxwdHwM2Lh8RUkQ2OCkrP/xAAaAQADAQEBAQAAAAAAAAAAAAABAgMABAUH/8QALBEAAgICAQMCBQQDAQAAAAAAAAECEQMhBBIxQVEiYXGBkaGx0RQyQvDx8RVC/9oADAMBAAIRAxEAPwD7KAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHm8H1dZ2h0p2vHnW1kY9h2tqj9Qw6l6y8wqWg9k7aS3mJfY7o3o1l8b0Z4Q2QdJrZbS3mG8wS8uR7m9zv6cPpV5x2pV0m7b0Z1m2yq6g8mXrZKk2r0Zqf0b7l4m1d6q9O4lY4u3d2k0c5pQ9Hq0kZx2oG7fG2H8u7YQ5fO+ZrU1j3m4mP2xkVQnq8TnZbWm0xqf3d2q5rZp2q1S0q5oYxV7fXg1p7m7w4v5j3b2Y8Y4d8mZ1n6f8ApJk7m9V2m3Ff2b9Qm9n6y+o9O4pY6bq6l0yXrY3d+Vq6m3l0p5l8a2v8A3c3j2v7g3o8fK3b8zqg0bqfXz3X0vV1bq0qk7b7p0J8s1o+Gq5+0x0V9VYx0i9VqfZ3m9p7lY8q1l8m5n1fU6l6m9a8fH7r2g2lq8zqfXqY7x3m7yP8A2c1j6k5+e6l4a9o2uW7t9m3u7uX3OZ8b9iO7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+VZ8b9K7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+VZ8b9K7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+VZ8b9K7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+VZ8b9K7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+VZ8b9K7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+VZ8b9K7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+VZ8b9K7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+VZ8b9K7Y9bq7YfU6r6m9o9J6bq6n0uXbY3d+Vf/2Q=="),

    /* (4) 백업 데님 (만일 임베드가 깨져도 최소 보장) */
    repeating-linear-gradient(
      135deg,
      rgba(20,42,78,0.75) 0px,
      rgba(20,42,78,0.75) 2px,
      rgba(13,30,58,0.75) 2px,
      rgba(13,30,58,0.75) 6px
    );

  background-repeat:no-repeat;
  background-size:cover;
  background-position:center;

  /* 실사 느낌은 과하면 CG 됨 → 최소만 */
  filter:saturate(1.05) contrast(1.03);

  /* 깊이감 */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.03),
    inset 0 0 90px rgba(0,0,0,0.55);
}

.denim-left{
  left:0;
  transform:translateX(calc(-100% * var(--progress,0)));
  background-position:left center;
}
.denim-right{
  right:0;
  transform:translateX(calc(100% * var(--progress,0)));
  background-position:right center;
}

/* 중앙 seam 라인(얇게) */
.denim-left{
  box-shadow:
    inset -1px 0 0 rgba(255,255,255,0.05),
    inset 0 0 90px rgba(0,0,0,0.55);
}
.denim-right{
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,0.05),
    inset 0 0 90px rgba(0,0,0,0.55);
}

/* 지퍼 열릴 때 천 흔들림 */
.denim-shake-left{ animation:shakeLeft 0.42s ease-in-out; }
.denim-shake-right{ animation:shakeRight 0.42s ease-in-out; }
@keyframes shakeLeft{
  0%{ transform:translateX(calc(-100% * var(--progress,0))); }
  30%{ transform:translateX(calc(-100% * var(--progress,0))) translateX(7px); }
  60%{ transform:translateX(calc(-100% * var(--progress,0))) translateX(-4px); }
  100%{ transform:translateX(calc(-100% * var(--progress,0))); }
}
@keyframes shakeRight{
  0%{ transform:translateX(calc(100% * var(--progress,0))); }
  30%{ transform:translateX(calc(100% * var(--progress,0))) translateX(-7px); }
  60%{ transform:translateX(calc(100% * var(--progress,0))) translateX(4px); }
  100%{ transform:translateX(calc(100% * var(--progress,0))); }
}

/* ================= 중앙 지퍼 라인 ================= */
.zipper-line{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:14px;height:100%;
  z-index:3;transition:opacity 0.4s ease;
  background:linear-gradient(#cfcfcf,#6f6f6f);
  box-shadow:0 0 0 1px rgba(255,255,255,0.10), 0 0 30px rgba(255,255,255,0.06);
}
.zipper-line::before{
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.35) 0px,
      rgba(0,0,0,0.35) 6px,
      rgba(255,255,255,0.35) 6px,
      rgba(255,255,255,0.35) 12px
  );
  opacity:0.55; mix-blend-mode:overlay;
}
.zipper-line::after{
  content:"";
  position:absolute; left:50%; top:0; transform:translateX(-50%);
  width:8px; height:100%;
  background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.00) 0px,
      rgba(255,255,255,0.00) 6px,
      rgba(255,255,255,0.22) 6px,
      rgba(255,255,255,0.22) 10px
  );
  opacity:0.55;
}

/* ================= 지퍼 헤드 ================= */
.zipper-head{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:46px;height:66px;cursor:grab;z-index:4;
  touch-action:none;
}
.zipper-head:active{cursor:grabbing;}
.metal{
  width:100%;height:100%;
  background:linear-gradient(#dcdcdc,#8e8e8e);
  border-radius:8px;
  position:relative; overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.20), 0 10px 26px rgba(0,0,0,0.35);
}
.metal::after{
  content:"";
  position:absolute; inset:-40% -60%;
  background:linear-gradient(110deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.10) 35%,
    rgba(255,255,255,0.30) 45%,
    rgba(255,255,255,0.08) 55%,
    rgba(255,255,255,0) 70%
  );
  transform:translateX(-40%) rotate(8deg);
  opacity:0.85;
  animation:metalSweep 2.2s ease-in-out infinite;
}
@keyframes metalSweep{
  0%{ transform:translateX(-60%) rotate(8deg); }
  60%{ transform:translateX(55%) rotate(8deg); }
  100%{ transform:translateX(55%) rotate(8deg); }
}
.zipper-head.is-open .metal::after{ animation:none; opacity:0.12; }

/* ================= 내부 ================= */
.inside{
  position:absolute;inset:0;background:#0b0b0b;
  display:flex;justify-content:center;align-items:center;
  clip-path:polygon(50% 0%,50% 0%,50% 100%,50% 100%);
  transition:clip-path 0.8s ease;z-index:1;
}
.inside.open{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}
.center-wrap{display:flex;flex-direction:column;align-items:center;}
.logo{
  opacity:0;transform:translateY(20px);
  transition:opacity 0.8s ease, transform 0.8s ease;
  font-size:44px;font-weight:600;letter-spacing:0.28em;color:#fff;
}
.logo.show{opacity:1;transform:translateY(0);}
.colon{letter-spacing:0.1em;}
.menu{
  margin-top:24px;opacity:0;transform:translateY(15px);
  transition:opacity 0.8s ease, transform 0.8s ease;
  font-size:12px;letter-spacing:0.4em;color:#bfbfbf;cursor:pointer;
}
.menu.show{opacity:1;transform:translateY(0);}
.menu:hover{color:#fff;}

/* ================= HINT ================= */
.hint{
  position:fixed; left:50%; top:60%;
  transform:translate(-50%,-50%);
  font-size:12px;
  letter-spacing:0.42em;
  color:rgba(255,255,255,0.68);
  z-index:5;
  opacity:0;
  transition:opacity 0.6s ease, transform 0.6s ease;
  pointer-events:none;
  text-shadow:0 0 20px rgba(255,255,255,0.10);
}
.hint.show{opacity:1; transform:translate(-50%,-50%);}
.hint.hide{opacity:0; transform:translate(-50%,-50%) translateY(10px);}

/* ================= COLLECTION SECTION ================= */
.collection-section{
  position:absolute;inset:0;background:#0b0b0b;
  display:flex;justify-content:center;align-items:center;
  opacity:0;pointer-events:none;transition:opacity 0.8s ease;
  z-index:2;
}
.collection-section.active{opacity:1;pointer-events:auto;}

.frame-wrapper{
  width:100%;
  display:flex;
  gap:60px;
  padding:0 60px;
  overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.frame-wrapper::-webkit-scrollbar{display:none;}
.frame{
  min-width:420px; height:340px;
  flex-shrink:0;
  scroll-snap-align:center;
  border:1px solid rgba(255,255,255,0.18);
  display:flex;justify-content:center;align-items:center;
  font-size:20px;letter-spacing:0.3em;color:#fff;
  opacity:0;transform:translateY(30px);
  transition:all 0.8s cubic-bezier(.77,0,.18,1);
  cursor:pointer;
}
.collection-section.active .frame{opacity:1;transform:translateY(0);}
.collection-section.active .frame:nth-child(1){transition-delay:0.2s;}
.collection-section.active .frame:nth-child(2){transition-delay:0.3s;}
.collection-section.active .frame:nth-child(3){transition-delay:0.4s;}
.collection-section.active .frame:nth-child(4){transition-delay:0.5s;}
.frame:hover{border-color:#fff;transform:scale(1.03);}
@media (max-width: 520px){
  .frame-wrapper{gap:20px;padding:0 20px;}
  .frame{min-width:82vw;height:300px;}
}

/* ================= CATEGORY PAGE ================= */
.category-page{
  position:fixed;inset:0;background:#000;
  opacity:0;pointer-events:none;
  transition:opacity 0.5s ease;
  z-index:20;
}
.category-page.active{opacity:1;pointer-events:auto;}
.back-btn{
  position:absolute; top:24px; left:24px; z-index:25;
  border:1px solid rgba(255,255,255,0.25);
  background:transparent;color:#fff;
  padding:10px 14px;border-radius:999px;
  font-size:12px;letter-spacing:0.25em;
  cursor:pointer;
}
.back-btn:hover{border-color:#fff;}
.category-title{
  position:absolute; top:30px; left:50%;
  transform:translateX(-50%);
  z-index:24;
  font-size:18px;letter-spacing:0.35em;
  opacity:0.9; text-align:center;
  pointer-events:none;
}
.controls{
  position:absolute; top:78px; left:24px; right:24px;
  display:flex; gap:12px; align-items:center;
  z-index:24;
}
.search{
  flex:1;
  border:1px solid rgba(255,255,255,0.18);
  background:transparent;
  color:#fff;
  padding:12px 14px;
  border-radius:999px;
  font-size:12px;
  letter-spacing:0.22em;
  outline:none;
}
.search::placeholder{ color:rgba(255,255,255,0.5); }
.sort,.price{
  border:1px solid rgba(255,255,255,0.18);
  background:#000;
  color:#fff;
  padding:12px 14px;
  border-radius:999px;
  font-size:12px;
  letter-spacing:0.18em;
  outline:none;
  cursor:pointer;
}
.grid{
  position:absolute; left:24px; right:24px; top:130px; bottom:24px;
  overflow:auto;
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:18px;
  padding-bottom:24px;
}
@media (max-width: 900px){ .grid{grid-template-columns:repeat(2, minmax(0,1fr));} }
@media (max-width: 520px){
  .controls{flex-direction:column; align-items:stretch;}
  .sort,.price,.search{width:100%;}
  .grid{ top:170px; }
}
.card{
  border:1px solid rgba(255,255,255,0.16);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:transform 0.2s ease, border-color 0.2s ease;
}
.card:hover{transform:translateY(-2px);border-color:#fff;}
.thumb{
  height:180px;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), rgba(255,255,255,0) 55%),
    linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
}
.card-body{padding:14px 14px 16px;}
.pname{font-size:14px;letter-spacing:0.18em;opacity:0.95;}
.pmeta{margin-top:8px;font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.7);}

/* ================= PRODUCT MODAL ================= */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.72);
  display:flex;justify-content:center;align-items:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.25s ease;
  z-index:30;
}
.modal.active{opacity:1;pointer-events:auto;}
.modal-panel{
  width:min(860px, calc(100vw - 40px));
  border:1px solid rgba(255,255,255,0.22);
  border-radius:22px;
  background:#060606;
  overflow:hidden;
}
.modal-top{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.12);
}
.modal-title{font-size:14px;letter-spacing:0.22em;opacity:0.95;}
.close-btn{
  border:none;background:transparent;color:#fff;
  font-size:18px;cursor:pointer;opacity:0.8;
}
.close-btn:hover{opacity:1;}
.modal-content{
  display:grid;grid-template-columns:1.2fr 1fr;
  gap:0;
}
@media (max-width: 800px){ .modal-content{grid-template-columns:1fr;} }
.modal-image{
  min-height:340px;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,0.14), rgba(255,255,255,0) 55%),
    linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
}
.modal-info{padding:18px 18px 22px;}
.modal-desc{
  font-size:12px;line-height:1.8;
  letter-spacing:0.06em;color:rgba(255,255,255,0.78);
  white-space:pre-line;
}
.modal-actions{
  margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;
}
.action{
  border:1px solid rgba(255,255,255,0.22);
  background:transparent;color:#fff;
  padding:10px 14px;border-radius:999px;
  font-size:12px;letter-spacing:0.18em;cursor:pointer;
}
.action:hover{border-color:#fff;}
</style>
</head>

<body>
<div class="denim-left"></div>
<div class="denim-right"></div>
<div class="zipper-line"></div>

<div class="zipper-head" role="button" tabindex="0" aria-label="지퍼 열기">
  <div class="metal"></div>
</div>

<div class="hint" aria-hidden="true">PULL TO OPEN</div>

<div class="inside">
  <div class="center-wrap">
    <div class="logo">NOMADE<span class="colon">:</span>TP</div>
    <div class="menu" role="button" tabindex="0" aria-label="컬렉션 보기">COLLECTION</div>
  </div>
</div>

<div class="collection-section" aria-label="컬렉션 메뉴">
  <div class="frame-wrapper">
    <div class="frame" data-cat="TOP" role="button" tabindex="0">TOP</div>
    <div class="frame" data-cat="BOTTOM" role="button" tabindex="0">BOTTOM</div>
    <div class="frame" data-cat="SET" role="button" tabindex="0">SET</div>
    <div class="frame" data-cat="ACCESSORY" role="button" tabindex="0">ACCESSORY</div>
  </div>
</div>

<!-- CATEGORY PAGE -->
<div class="category-page" aria-hidden="true">
  <button class="back-btn" type="button">BACK</button>
  <div class="category-title">CATEGORY</div>

  <div class="controls">
    <input class="search" type="text" placeholder="SEARCH" aria-label="상품 검색" />
    <select class="sort" aria-label="정렬">
      <option value="new">NEW</option>
      <option value="price_asc">PRICE ↑</option>
      <option value="price_desc">PRICE ↓</option>
      <option value="name_asc">NAME A→Z</option>
    </select>
    <select class="price" aria-label="가격 필터">
      <option value="all">PRICE: ALL</option>
      <option value="0-80000">~ 80,000</option>
      <option value="80000-150000">80,000 - 150,000</option>
      <option value="150000-9999999">150,000+</option>
    </select>
  </div>

  <div class="grid"></div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="상품 상세">
    <div class="modal-top">
      <div class="modal-title">PRODUCT</div>
      <button class="close-btn" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="modal-content">
      <div class="modal-image"></div>
      <div class="modal-info">
        <div class="modal-desc"></div>
        <div class="modal-actions">
          <button class="action" type="button">ADD TO CART</button>
          <button class="action" type="button">DETAIL</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>

let dragging = false;
let opened = false;
let introAnimating = false;

const OPEN_THRESHOLD = 0.45;

let currentCat = null;
let currentItems = [];

const DATA = {

  ],

  ],
  SET: [
    { name:"DENIM SET 01", price:"₩279,000", desc:"Matching set. Clean seams. Bold minimalism."},

  ],
  ACCESSORY: [
    { name:"LEATHER BELT", price:"₩59,000", desc:"Matte leather. Minimal buckle. Daily essential."},
    { name:"CAP", price:"₩39,000", desc:"Low profile. Soft brim. Subtle logo."},
    { name:"TOTE BAG", price:"₩69,000", desc:"Canvas tote. Reinforced handle. Carry everything."}
  ]
};

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function openZipper(){
  if (opened) return;
  opened = true;

  hint?.classList.remove("show");
  hint?.classList.add("hide");
  zipper.classList.add("is-open");

  denimLeft.classList.add("denim-shake-left");
  denimRight.classList.add("denim-shake-right");
  setTimeout(()=>{
    denimLeft.classList.remove("denim-shake-left");
    denimRight.classList.remove("denim-shake-right");
  }, 420);

  inside.classList.add("open");

  [denimLeft, denimRight, zipperLine, zipper].forEach(el => {
    el.style.pointerEvents = "none";
    el.style.opacity = 0;
  });

  setTimeout(()=>{
    denimLeft.style.display = "none";
    denimRight.style.display = "none";
    zipperLine.style.display = "none";
    zipper.style.display = "none";

    logo.classList.add("show");
    menu.classList.add("show");
  }, 500);
}

function setProgress(progress){
  const vh = window.innerHeight;
  const zipperH = zipper.offsetHeight || 60;
  const maxY = Math.max(0, vh - zipperH);

  const p = clamp(progress, 0, 1);
  const y = p * maxY;

  document.body.style.setProperty("--progress", p.toFixed(4));
  zipper.style.top = y + "px";
}

function move(y){
  if(opened) return;

  const vh = window.innerHeight;
  const zipperH = zipper.offsetHeight || 60;
  const maxY = Math.max(0, vh - zipperH);

  const clampedY = clamp(y, 0, maxY);
  const progress = maxY > 0 ? (clampedY / maxY) : 0;

  document.body.style.setProperty("--progress", progress.toFixed(4));
  zipper.style.top = clampedY + "px";

  if(!introAnimating && progress > OPEN_THRESHOLD) openZipper();
}

function startDrag(){ if(!opened && !introAnimating) dragging = true; }
function endDrag(){ dragging = false; }

zipper.addEventListener("mousedown", startDrag);
window.addEventListener("mouseup", endDrag);
window.addEventListener("mousemove",(e)=>{ if(dragging) move(e.clientY); });

zipper.addEventListener("touchstart",(e)=>{ startDrag(); e.preventDefault(); }, {passive:false});
window.addEventListener("touchend", endDrag);
window.addEventListener("touchmove",(e)=>{
  if(dragging){ e.preventDefault(); move(e.touches[0].clientY); }
}, {passive:false});

zipper.addEventListener("keydown",(e)=>{
  if(introAnimating) return;
  if(e.key==="Enter" || e.key===" "){
    e.preventDefault();
    move(window.innerHeight);
  }
});

function openCollection(){
  logo.classList.remove("show");
  menu.classList.remove("show");
  setTimeout(()=> collectionSection.classList.add("active"), 300);
  location.hash = "collection";
}
menu.addEventListener("click", openCollection);
menu.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openCollection(); }
});

function parsePriceKRW(s){
  return Number(String(s).replace(/[^\d]/g,"")) || 0;
}

function applyControlsAndRender(){
  const q = (searchEl?.value || "").trim().toLowerCase();
  const sort = sortEl?.value || "new";
  const pr = priceEl?.value || "all";

  let list = [...currentItems];

  if(q) list = list.filter(p => p.name.toLowerCase().includes(q));

  if(pr !== "all"){
    const [min,max] = pr.split("-").map(Number);
    list = list.filter(p=>{
      const v = parsePriceKRW(p.price);
      return v >= min && v <= max;
    });
  }

  if(sort === "price_asc"){
    list.sort((a,b)=>parsePriceKRW(a.price)-parsePriceKRW(b.price));
  }else if(sort === "price_desc"){
    list.sort((a,b)=>parsePriceKRW(b.price)-parsePriceKRW(a.price));
  }else if(sort === "name_asc"){
    list.sort((a,b)=>a.name.localeCompare(b.name));
  }

  grid.innerHTML = "";
  list.forEach((p)=>{
    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");
    card.setAttribute("aria-label", `${p.name} 상세 보기`);

    card.innerHTML = `
      <div class="thumb"></div>
      <div class="card-body">
        <div class="pname">${p.name}</div>
        <div class="pmeta">${p.price}</div>
      </div>
    `;

    const open = ()=> {
      openModal(currentCat, p);
      location.hash = `product=${encodeURIComponent(currentCat)}|${encodeURIComponent(p.name)}`;
    };

    card.addEventListener("click", open);
    card.addEventListener("keydown",(e)=>{
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); }
    });

    grid.appendChild(card);
  });
}

function renderCategory(cat){
  currentCat = cat;
  categoryTitle.textContent = cat;
  currentItems = DATA[cat] || [];

  if(searchEl) searchEl.value = "";
  if(sortEl) sortEl.value = "new";
  if(priceEl) priceEl.value = "all";

  applyControlsAndRender();
}

[searchEl, sortEl, priceEl].forEach(el=>{
  if(!el) return;
  el.addEventListener("input", applyControlsAndRender);
  el.addEventListener("change", applyControlsAndRender);
});

function openCategory(cat){
  renderCategory(cat);
  categoryPage.classList.add("active");
  categoryPage.setAttribute("aria-hidden","false");
  location.hash = `category=${encodeURIComponent(cat)}`;
}

function closeCategory(){
  categoryPage.classList.remove("active");
  categoryPage.setAttribute("aria-hidden","true");
  closeModal();
  location.hash = "collection";
}

frames.forEach(frame=>{
  const cat = frame.dataset.cat;
  const open = ()=> openCategory(cat);

  frame.addEventListener("click", open);
  frame.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); }
  });
});

backBtn.addEventListener("click", closeCategory);

function openModal(cat, product){
  modalTitle.textContent = product.name;
  modalDesc.textContent = `${cat} / ${product.price}\n\n${product.desc}`;
  modal.classList.add("active");
  modal.setAttribute("aria-hidden","false");
}
function closeModal(){
  modal.classList.remove("active");
  modal.setAttribute("aria-hidden","true");
}

modalClose.addEventListener("click", closeModal);
modal.addEventListener("click",(e)=>{ if(e.target === modal) closeModal(); });

window.addEventListener("keydown",(e)=>{
  if(e.key==="Escape"){
    if(modal.classList.contains("active")) closeModal();
    else if(categoryPage.classList.contains("active")) closeCategory();
  }
});

/* ✅ 첫 진입: 수동 / 새로고침(reload): 자동 내려감 + 자동 오픈 */
function isReloadNav(){
  const entry = performance.getEntriesByType?.("navigation")?.[0];
  if (entry && typeof entry.type === "string") return entry.type === "reload";
  return performance.navigation && performance.navigation.type === 1; // Safari 구형
}

function runAutoZipperOnReload(){
  if(opened || introAnimating) return;

  if(!isReloadNav()){
    setProgress(0);
    hint?.classList.add("show");
    hint?.classList.remove("hide");
    return;
  }

  introAnimating = true;
  hint?.classList.add("show");
  hint?.classList.remove("hide");

  denimLeft.style.display = "";
  denimRight.style.display = "";
  zipperLine.style.display = "";
  zipper.style.display = "";
  [denimLeft, denimRight, zipperLine, zipper].forEach(el => {
    el.style.opacity = 1;
    el.style.pointerEvents = "auto";
  });

  collectionSection.classList.remove("active");
  categoryPage.classList.remove("active");
  categoryPage.setAttribute("aria-hidden","true");
  closeModal();

  if(location.hash){
    history.replaceState(null, "", window.location.pathname);
  }

  setProgress(0);

  const duration = 1900;
  const start = performance.now();
  const ease = (t)=> t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;

  function tick(now){
    const t = clamp((now - start) / duration, 0, 1);
    setProgress(0.92 * ease(t));
    if(t < 1) requestAnimationFrame(tick);
    else{
      introAnimating = false;
      openZipper();
    }
  }
  requestAnimationFrame(tick);
}
runAutoZipperOnReload();

/* ✅ 아주 약한 패럴랙스(과하면 CG라 0.8%만) */
(function parallax(){
  window.addEventListener("mousemove", (e)=>{
    if(opened) return;
    const cy = window.innerHeight/2;
    const my = (e.clientY - cy) / cy;
    denimLeft.style.backgroundPosition = `left ${50 + my*0.8}%`;
    denimRight.style.backgroundPosition = `right ${50 + my*0.8}%`;
  }, {passive:true});
})();
</script>
