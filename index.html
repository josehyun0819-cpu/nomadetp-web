<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOMADE:TP | Official</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Pretendard', sans-serif; }

        /* 1. 배경: 더 리얼한 데님 질감 (노이즈와 패턴 조합) */
        .denim-side { 
            width: 50%; height: 100%; 
            background-color: #1a2a44;
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 2px),
                radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%),
                url('https://www.transparenttextures.com/patterns/denim.png'); /* 미세한 데님 패턴 추가 */
            position: relative; 
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1); /* 자동 오픈 애니메이션 */
            will-change: transform;
        }

        /* 지퍼 안쪽 공간 */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1; background: #000;
        }

        .brand-logo { 
            font-size: clamp(2rem, 10vw, 4rem); color: #fff; letter-spacing: 15px; 
            opacity: 0; transform: scale(0.9); transition: 1.5s ease-out;
            font-weight: 200; margin-bottom: 30px;
        }

        .menu-list { list-style: none; padding: 0; text-align: center; }
        .menu-list li { 
            font-size: 1.1rem; margin: 25px 0; color: #444; cursor: pointer;
            opacity: 0; transform: translateY(20px); transition: 1s;
            letter-spacing: 5px; text-transform: uppercase;
        }
        .menu-list li.visible { opacity: 1; transform: translateY(0); color: #fff; }

        /* 지퍼 레이어 */
        .zipper-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; pointer-events: none; }
        .left-denim { border-right: 1px solid #000; }
        .right-denim { border-left: 1px solid #000; }

        /* 금속 지퍼 이빨 */
        .left-denim::after, .right-denim::after {
            content: ''; position: absolute; top: 0; width: 12px; height: 100%;
            background: repeating-linear-gradient(to bottom, #333 0px, #333 4px, #aaa 5px, #333 6px);
            background-size: 100% 10px;
        }
        .left-denim::after { right: 0; }
        .right-denim::after { left: 0; }

        /* 지퍼 손잡이 (인터랙션 포인트) */
        #puller {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, 0);
            width: 50px; height: 100px; z-index: 20; cursor: grab;
            transition: top 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .puller-tab {
            width: 34px; height: 60px; background: linear-gradient(145deg, #777, #222);
            margin: 20px auto; border-radius: 4px; border: 1px solid #111;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        .puller-tab::after { content: 'TP'; color: #000; font-weight: 900; font-size: 14px; opacity: 0.7; }

        .guide { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); color: #fff; z-index: 25; font-size: 10px; letter-spacing: 5px; opacity: 0.5; transition: 0.5s; }
    </style>
</head>
<body>

    <div class="content-layer">
        <div class="brand-logo" id="logo">NOMADE:TP</div>
        <ul class="menu-list">
            <li class="m-item">New Expedition</li>
            <li class="m-item">Lookbook '26</li>
            <li class="m-item">Store</li>
            <li class="m-item">Contact</li>
        </ul>
    </div>

    <div class="zipper-wrapper">
        <div class="denim-side left-denim" id="left"></div>
        <div class="denim-side right-denim" id="right"></div>
    </div>
    
    <div id="puller">
        <div class="puller-tab"></div>
    </div>

    <div class="guide" id="guide-text">PULL DOWN TO UNZIP</div>

    <audio id="zip-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script>
        const puller = document.getElementById('puller');
        const left = document.getElementById('left');
        const right = document.getElementById('right');
        const logo = document.getElementById('logo');
        const items = document.querySelectorAll('.m-item');
        const sound = document.getElementById('zip-sound');
        const guide = document.getElementById('guide-text');

        let isDragging = false;
        let isOpened = false;

        const openZipper = () => {
            if (isOpened) return;
            isOpened = true;
            
            // 1. 지퍼 끝까지 내리기
            puller.style.top = '85%';
            
            // 2. 데님 배경 양옆으로 활짝 열기
            left.style.transform = "translateX(-100%) rotate(-10deg)";
            right.style.transform = "translateX(100%) rotate(10deg)";
            
            // 3. 사운드 재생
            sound.volume = 0.3;
            sound.play();
            
            // 4. 로고 및 메뉴 순차 등장
            logo.style.opacity = "1";
            logo.style.transform = "scale(1)";
            items.forEach((item, i) => {
                setTimeout(() => item.classList.add('visible'), 500 + (i * 200));
            });
            
            // 5. 가이드 텍스트 제거
            guide.style.opacity = "0";
            puller.style.pointerEvents = "none"; // 열린 후 드래그 방지
        };

        // 마우스/터치 드래그 시작 시 바로 오픈 로직 실행
        const startAction = () => {
            if (!isOpened) openZipper();
        };

        puller.addEventListener('mousedown', startAction);
        puller.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startAction();
        }, {passive: false});

        // 화면 어디든 클릭해도 열리게 하려면 아래 주석 해제
        // window.addEventListener('click', startAction);
    </script>
</body>
</html>
