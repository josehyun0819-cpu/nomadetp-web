<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOMADE:TP</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 200vh;
  background: #0f0f0f;
  overflow-x: hidden;
}

.zip-section {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* Denim Layers */
.denim {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  background: url('./assets/denim.jpg') center/cover no-repeat;
  transition: transform 0.1s linear;
}

.left { left: 0; }
.right { right: 0; }

/* Zipper */
.zipper {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  height: 100%;
  width: 6px;
  background: linear-gradient(to bottom, #aaa, #777);
}

.zip-handle {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 18px;
  height: 24px;
  background: silver;
  border-radius: 4px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

/* Inside World */
.inside {
  position: absolute;
  inset: 0;
  background: #0f0f0f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.logo {
  font-family: "Cormorant Garamond", serif;
  font-weight: 300;
  font-size: 48px;
  letter-spacing: 0.4em;
  color: white;
  margin-bottom: 30px;
}

.menu a {
  font-family: "Inter", sans-serif;
  font-size: 14px;
  color: #ccc;
  margin: 0 12px;
  text-decoration: none;
  transition: color 0.3s ease;
}

.menu a:hover {
  color: white;
}
</style>
</head>

<body>

<section class="zip-section">

  <div class="denim left"></div>
  <div class="denim right"></div>

  <div class="zipper">
    <div class="zip-handle"></div>
  </div>

  <div class="inside">
    <h1 class="logo">N O M A D E : T P</h1>
    <nav class="menu">
      <a href="#">New Expedition</a>
      <a href="#">Lookbook ’26</a>
      <a href="#">Store</a>
      <a href="#">Contact</a>
    </nav>
  </div>

</section>

<script>
const left = document.querySelector(".left");
const right = document.querySelector(".right");
const handle = document.querySelector(".zip-handle");
const inside = document.querySelector(".inside");

window.addEventListener("scroll", () => {
  const scrollY = window.scrollY;
  const maxScroll = window.innerHeight;

  const progress = Math.min(scrollY / maxScroll, 1);

  // Move zipper handle
  handle.style.top = `${progress * 100}%`;

  // Open denim
  left.style.transform = `translateX(-${progress * 100}%)`;
  right.style.transform = `translateX(${progress * 100}%)`;

  // Reveal inside
  if (progress > 0.4) {
    inside.style.opacity = (progress - 0.4) * 2;
  } else {
    inside.style.opacity = 0;
  }
});
</script>

</body>
</html>
